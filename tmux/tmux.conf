set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g base-index 1

set -g status-bg default

set-window-option -g mode-keys vi
set -sg escape-time 10

# renumber windows sequentially after closing any of them
# set -g renumber-windows on

if-shell 'test -z "$XDG_CONFIG_HOME"' \
  'set-environment -g XDG_CONFIG_HOME "$HOME/.config"'

if-shell 'test -f "$XDG_CONFIG_HOME/tmux/dwm.tmux"' \
  'source-file "$XDG_CONFIG_HOME/tmux/dwm.tmux"' \
  'display-message "missing $XDG_CONFIG_HOME/tmux/dwm.tmux"'

if-shell 'test -f "$XDG_CONFIG_HOME/tmux/style.conf"' \
  'source-file "$XDG_CONFIG_HOME/tmux/style.conf"' \
  'display-message "missing $XDG_CONFIG_HOME/tmux/style.conf"'

if-shell 'test -f "$XDG_CONFIG_HOME/tmux/bindings.conf"' \
  'source-file "$XDG_CONFIG_HOME/tmux/bindings.conf"' \
  'display-message "missing $XDG_CONFIG_HOME/tmux/bindings.conf"'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
